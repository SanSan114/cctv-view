<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-CAM Live Stream & Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h2 { margin-bottom: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 15px; border-radius: 10px; }
        img { width: 100%; height: auto; border-radius: 8px; background: #334155; }
        .status { margin-top: 10px; font-size: 14px; color: #38bdf8; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-on { background-color: #22c55e; color: white; }
        .btn-off { background-color: #ef4444; color: white; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>CCTV ESP32-CAM (MQTT)</h2>
        <img id="cctv-frame" src="" alt="Menunggu Frame dari Kamera..." />
        <p class="status" id="status-text">Status: Menghubungkan ke Broker...</p>
        
        <div class="btn-group">
            <button class="btn-on" onclick="controlFlash('1')">FLASH ON</button>
            <button class="btn-off" onclick="controlFlash('0')">FLASH OFF</button>
        </div>
    </div>

    <script>
        const streamTopic = "ihsan/cctv/stream/v1"; 
        const controlTopic = "ihsan/cctv/flash/v1"; 
        const clientID = "web_client_" + Math.random().toString(16).substr(2, 8);
        const statusText = document.getElementById("status-text");
        const imgElement = document.getElementById("cctv-frame");

        const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, clientID);

        client.onConnectionLost = function (responseObject) {
            statusText.innerText = "Status: Terputus dari Broker!";
        };

        client.onMessageArrived = function (message) {
            imgElement.src = "data:image/jpeg;base64," + message.payloadString;
            statusText.innerText = "Status: Live (Menerima Frame)";
        };

        client.connect({
            useSSL: true,
            onSuccess: function () {
                statusText.innerText = "Status: Terhubung! Menunggu Kamera...";
                client.subscribe(streamTopic);
            },
            onFailure: function (message) {
                statusText.innerText = "Status: Gagal Terhubung ke Broker";
            }
        });

        function controlFlash(state) {
            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(state);
                message.destinationName = controlTopic;
                client.send(message);
            } else {
                alert("MQTT belum terhubung!");
            }
        }
    </script>
</body>
</html>
